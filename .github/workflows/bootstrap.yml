name: bootstrap-guidance
on:
  pull_request:
    paths:
      - '**.md'
      - 'spec/**'
      - 'contracts/**'
      - 'tests/fixtures/**'
      - 'scripts/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guidance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check bootstrap guidance and public tree
        run: |
          python3 scripts/check_guidance.py
          python3 scripts/check_public_tree.py
# This is not application acceptance CI. Add targeted implementation jobs as they exist.
# Check the pinned checkout action for security updates before production release.
