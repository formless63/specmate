name: app
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'packages/**'
      - 'runner/**'
      - 'deploy/**'
      - 'tests/fixtures/**'
      - 'tests/native/**'
      - 'tests/portable/**'
      - 'toolpacks/kicad/**'
      - 'scripts/check_native_fixtures.py'
      - 'scripts/verify_selected_package.py'
      - 'Makefile'
      - 'compose.example.yaml'
      - '.dockerignore'
      - '.env.example'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.node-version'
      - '.github/workflows/app.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: specmate
          POSTGRES_PASSWORD: specmate-ci
          POSTGRES_DB: specmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specmate" --health-interval 5s --health-retries 10
    env:
      SPECMATE_ENVIRONMENT: development
      SPECMATE_DB_HOST: 127.0.0.1
      SPECMATE_DB_PORT: '5432'
      SPECMATE_DB_PASSWORD: specmate-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      - run: uv sync --frozen
      - run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
      - run: uv run --frozen python manage.py makemigrations --check --dry-run
      - run: uv run --frozen pytest
      - name: Runner and deployment source checks
        working-directory: .
        run: |
          uv run --project backend --frozen ruff check runner deploy/configure.py scripts/check_native_fixtures.py tests/native toolpacks/kicad
          uv run --project backend --frozen ruff format --check runner deploy/configure.py scripts/check_native_fixtures.py tests/native toolpacks/kicad
          PYTHONPATH=runner uv run --project backend --frozen python -m unittest discover -s runner/tests -v
          make check-fixtures
          uv run --project backend --frozen ruff check --config backend/pyproject.toml scripts/verify_selected_package.py tests/portable
          uv run --project backend --frozen ruff format --check --config backend/pyproject.toml scripts/verify_selected_package.py tests/portable
          make portable-test
        # Real Docker/native-pack cases require explicit cached-image opt-in at a checkpoint.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
# Targeted implementation checks only. Real-tool, journey and release checks run at checkpoints.
